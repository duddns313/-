<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>호그와트 7년</title>
<meta name="description" content="해리 포터와 같은 해에 입학한 윤영운의 호그와트 7년 — 사건 카드로 겪는 텍스트 어드벤처" />
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16131c" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <div id="dateline"></div>
    <div id="resbar"></div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <nav id="dock" hidden>
    <button data-sheet="log"><span>📜</span>기록</button>
    <button data-sheet="bag"><span>🎒</span>소지품</button>
    <button data-sheet="me"><span>🪄</span>영운</button>
    <button data-sheet="dex"><span>📖</span>도감</button>
    <button data-sheet="settings"><span>⚙️</span>설정</button>
  </nav>
  <div id="sheet-backdrop" hidden></div>
  <section id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </section>
  <div id="toast" role="status"></div>
</div>

<!-- 데이터 · 코어 (순서 중요) -->
<script src="js/data/meta.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/game.js"></script>
<!-- 1학년 -->
<script src="js/data/year1/prologue.js"></script>
<script src="js/data/year1/canon_autumn.js"></script>
<script src="js/data/year1/canon_spring.js"></script>
<script src="js/data/year1/places_castle.js"></script>
<script src="js/data/year1/places_grounds.js"></script>
<script src="js/data/year1/bonds.js"></script>
<!-- 화면 -->
<script src="js/ui/settings.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
