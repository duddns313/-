<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>호그와트: 그림자의 잔영</title>
<meta name="description" content="해리포터 세계관의 텍스트 로그라이크 — 진행도, 랜덤 인카운터, 주문 사슬 전투" />
<meta name="theme-color" content="#0e0c1a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <section id="setup-screen">
    <h2>호그와트: 그림자의 잔영</h2>
    <p class="setup-desc">호그와트 전투로부터 이십오 년. 무언가가 이름을 먹고 있다.</p>
    <div id="house-select"></div>
    <div id="setup-bar"></div>
    <div class="setup-buttons">
      <button id="btn-start" class="btn btn-primary hidden">시작</button>
      <button id="btn-continue" class="btn hidden">이어하기</button>
    </div>
  </section>

  <div id="game-shell" class="hidden">
    <header id="topbar">
      <div id="progress-wrap">
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-ticks"></div>
        </div>
      </div>
      <div id="topbar-main">
        <span id="topbar-progress"></span>
        <span id="topbar-warn" class="hidden"></span>
        <span id="topbar-points" class="hidden"></span>
      </div>
      <div id="topbar-vitals"></div>
      <div id="topbar-buttons">
        <button id="btn-settings" class="btn btn-tiny">⚙️</button>
        <button id="btn-reset" class="btn btn-tiny btn-danger">포기</button>
      </div>
    </header>

    <main id="tab-panels">
      <section id="panel-adventure" class="tab-panel">
        <div id="scene-page">
          <div id="scene-chapter" class="hidden"></div>
          <div id="scene-body"></div>
          <div id="scene-choices" class="hidden"></div>
        </div>
      </section>

      <section id="panel-register" class="tab-panel hidden"></section>
      <section id="panel-prepare" class="tab-panel hidden"></section>
      <section id="panel-record" class="tab-panel hidden"></section>
    </main>

    <nav id="bottom-tabs">
      <button class="tab-btn" data-tab="adventure"><span class="tab-icon">🕯️</span><span class="tab-label">모험</span></button>
      <button class="tab-btn" data-tab="register"><span class="tab-icon">📖</span><span class="tab-label">명부</span></button>
      <button class="tab-btn" data-tab="prepare"><span class="tab-icon">🪄</span><span class="tab-label">준비</span></button>
      <button class="tab-btn" data-tab="record"><span class="tab-icon">✒️</span><span class="tab-label">기록</span></button>
    </nav>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <div id="check-flash-container"></div>
  <div id="sheet-overlay" class="hidden">
    <div id="sheet-panel">
      <div id="sheet-handle"></div>
      <div id="sheet-content"></div>
    </div>
  </div>
</div>

<script src="js/data/houses.js"></script>
<script src="js/data/backgrounds.js"></script>
<script src="js/data/traits.js"></script>
<script src="js/data/rarity.js"></script>
<script src="js/data/spells.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/people.js"></script>
<script src="js/data/fragments.js"></script>
<script src="js/data/endings.js"></script>
<script src="js/data/achievements.js"></script>
<script src="js/data/beats.js"></script>
<script src="js/data/encounters/common.js"></script>
<script src="js/data/encounters/search.js"></script>
<script src="js/data/encounters/combat.js"></script>
<script src="js/data/encounters/eerie.js"></script>
<script src="js/data/encounters/deep.js"></script>
<script src="js/data/encounters/prologue.js"></script>
<script src="js/data/encounters/saga.js"></script>
<script src="js/data/encounters/special.js"></script>

<script src="js/systems/settings.js"></script>
<script src="js/systems/ledger.js"></script>
<script src="js/systems/check.js"></script>
<script src="js/systems/item.js"></script>
<script src="js/systems/loot.js"></script>
<script src="js/systems/spell.js"></script>
<script src="js/systems/duel.js"></script>
<script src="js/systems/achievement.js"></script>
<script src="js/systems/register.js"></script>
<script src="js/systems/progress.js"></script>

<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
