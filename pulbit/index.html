<title>풀빛 모험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: 손에 쥐는 게임기 한 대 — 위에 화면, 아래에 방향키와 A/B. 가운데 한 줄. */
:root{
  --shell:#cdd7c1;      /* 세이지색 플라스틱 몸체 */
  --shell-dk:#a8b59b;
  --bezel:#333a30;
  --ink:#1f2420;
  --btn:#b8455c;
  --btn-dk:#83303f;
  --pad:#2c302b;
  --paper:#fbfaf2;
  --line:#2b2f2a;
  --soft:#d9dfcc;
  --hp-good:#3fae5a; --hp-mid:#e0ad2f; --hp-low:#d9493f;
  --exp:#4a8fd9;
  --font-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-title:"Do Hyeon","Jua","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--shell);color:var(--ink);font-family:var(--font-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--exp);outline-offset:2px}
#app{
  height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;
  width:100%;max-width:min(480px,calc((100% - 230px) * 1.05));min-width:260px;
}
#bezel{background:var(--bezel);border-radius:12px 12px 34px 12px;padding:12px 12px 8px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#bezel .brand{font-family:var(--font-title);color:#c8d2bb;font-size:13px;letter-spacing:.12em;margin-top:6px;padding-left:2px;opacity:.8}
#screen{position:relative;width:100%;aspect-ratio:10/9;max-width:100%;background:#000;overflow:hidden;border-radius:4px;font-size:clamp(12px,3.7vw,17px)}
[hidden]{display:none!important}
#screen *{box-sizing:border-box}
#screen>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:#111;opacity:0;pointer-events:none;z-index:40}

/* 대화창 · 선택지 */
#msg{position:absolute;left:2%;right:2%;bottom:2%;height:30%;background:var(--paper);border:3px solid var(--line);border-radius:6px;
  padding:.45em .8em;line-height:1.45;box-shadow:inset 0 0 0 2px var(--soft);z-index:20;cursor:pointer;white-space:pre-line;overflow:hidden}
#msg p{margin:0}
#msg .next{position:absolute;right:.6em;bottom:.25em;font-size:.8em;color:var(--btn);animation:bob .55s infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
#menu{position:absolute;left:2%;right:2%;bottom:2%;background:var(--paper);border:3px solid var(--line);border-radius:6px;padding:.4em;
  box-shadow:inset 0 0 0 2px var(--soft);z-index:25;display:flex;flex-direction:column;gap:.3em;max-height:70%}
#menu .prompt{padding:.1em .4em 0;font-size:.9em;color:#4b5246}
.grid{display:grid;gap:.3em;overflow-y:auto;min-height:0}
.opt{background:#eef1e4;border:2px solid #c3cab3;border-radius:5px;padding:.4em .5em;font-size:1em;text-align:left;line-height:1.2;min-width:0}
.opt.sel{background:#fff;border-color:var(--line);box-shadow:0 2px 0 var(--line)}
.opt.dim{opacity:.45}
.opt small{display:block;font-size:.72em;margin-top:.15em}
.opt.back{text-align:center;background:transparent;border-style:dashed;padding:.25em}
.chip{display:inline-block;font-size:.7em;padding:.05em .45em;border-radius:999px;color:#fff;vertical-align:middle}

/* 전투 정보창 */
.hpbox{position:absolute;background:var(--paper);border:3px solid var(--line);border-radius:6px;padding:.15em .5em .3em;width:47%;font-size:.78em;line-height:1.25;z-index:10;box-shadow:inset 0 0 0 2px var(--soft)}
.hpbox.foe{left:3%;top:4%}
.hpbox.me{right:3%;top:39%}
.hpbox .top{display:flex;justify-content:space-between;gap:.4em;white-space:nowrap}
.hpbox .top b{font-weight:normal;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:.55em;background:#4a4f45;border-radius:3px;overflow:hidden;margin-top:.2em;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;width:100%;background:var(--hp-good);transition:width .5s linear,background-color .3s}
.hpbar.sm{height:.45em}
.hpbox .nums{text-align:right;font-size:.9em;margin-top:.1em;font-variant-numeric:tabular-nums}
.expbar{height:.3em;background:#cfd6c4;border-radius:2px;overflow:hidden;margin-top:.15em}
.expbar i{display:block;height:100%;width:0;background:var(--exp);transition:width .6s}

/* 큰 창: 몬스터 목록 · 도감 · 이름 · 스타터 */
#panel{position:absolute;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column}
.phead{display:flex;justify-content:space-between;align-items:center;padding:.4em .6em;background:var(--bezel);color:#eef2e6;font-family:var(--font-title);font-size:1.1em}
.phead button{background:#e9eee0;color:var(--ink);border:none;border-radius:4px;padding:.15em .6em;font-size:.8em;font-family:var(--font-ui)}
.pbody{flex:1;overflow-y:auto;padding:.5em;display:flex;flex-direction:column;gap:.4em;min-height:0}
.mrow{display:flex;gap:.5em;align-items:center;min-width:0}
.mrow canvas,.dex canvas,.mini{width:2.6em;height:2.6em;image-rendering:pixelated;flex:none;position:static!important}
.minfo{flex:1;min-width:0;display:flex;flex-direction:column}
.mname em{font-style:normal;font-size:.8em;color:#5a6152}
.mhp{font-size:.75em;color:#5a6152;font-variant-numeric:tabular-nums}
.dex{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1em}
.dex .no{font-size:.7em;color:#6a7262}
.starter-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.scard{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.5em .2em;background:#eef1e4;border:2px solid #c3cab3;border-radius:6px;text-align:center}
.scard canvas{width:3.6em;height:3.6em;image-rendering:pixelated;position:static!important}
.scard.sel{background:#fff;border-color:var(--line);box-shadow:0 2px 0 var(--line)}
.scard p{margin:0;font-size:.7em;color:#4b5246;line-height:1.3}
.namebox{display:flex;flex-direction:column;gap:.6em;padding:.4em}
.namebox input{font:inherit;font-size:1.2em;padding:.4em .5em;border:3px solid var(--line);border-radius:6px;background:#fff;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.namebox .go{background:var(--btn);color:#fff;border:none;border-radius:6px;padding:.5em;font-size:1.05em;box-shadow:0 3px 0 var(--btn-dk)}

/* 타이틀 */
#title{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;
  background:linear-gradient(#bfe3f2 0 46%,#a7d68a 46% 64%,#86c06c 64% 100%)}
#title h1{margin:0;font-family:var(--font-title);font-weight:normal;font-size:2.9em;color:#fffdf2;letter-spacing:.04em;
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px 3px 0 var(--line),3px -3px 0 var(--line),-3px -3px 0 var(--line),0 6px 0 #2f6b3a}
#title .sub{font-size:.85em;color:#24402a;background:rgba(251,250,242,.8);padding:.15em .6em;border-radius:999px}
#title .mons{display:flex;gap:.6em}
#title .mons canvas{position:static;width:3.4em;height:3.4em;image-rendering:pixelated;animation:hop 1.2s infinite ease-in-out}
#title .mons canvas:nth-child(2){animation-delay:.2s}
#title .mons canvas:nth-child(3){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-6px)}}
#title .tbtns{display:flex;flex-direction:column;gap:.4em;width:60%}
#title .tbtns button{background:var(--paper);border:3px solid var(--line);border-radius:6px;padding:.35em;font-size:1.05em;box-shadow:0 3px 0 var(--line)}
#title .tbtns button.sel{background:#fff7d6}

/* 패드 */
#pad{flex:1;min-height:180px;display:grid;grid-template-columns:1fr auto;align-items:center;position:relative;touch-action:none}
.dpad{--s:clamp(40px,12.5vw,52px);width:calc(var(--s)*3);height:calc(var(--s)*3);position:relative}
.dpad button{position:absolute;width:var(--s);height:var(--s);background:var(--pad);border:none;color:#7c8476;font-size:.9em;touch-action:none;padding:0}
.dpad .u{left:var(--s);top:0;border-radius:6px 6px 0 0}
.dpad .d{left:var(--s);top:calc(var(--s)*2);border-radius:0 0 6px 6px}
.dpad .l{left:0;top:var(--s);border-radius:6px 0 0 6px}
.dpad .r{left:calc(var(--s)*2);top:var(--s);border-radius:0 6px 6px 0}
.dpad .c{position:absolute;left:var(--s);top:var(--s);width:var(--s);height:var(--s);background:var(--pad)}
.dpad button.on,.ab button.on{filter:brightness(1.5)}
.ab{display:flex;gap:12px;transform:rotate(-22deg);padding-right:4px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:4px}
.ab div:first-child{margin-top:30px}
.ab button{--b:clamp(52px,16vw,64px);width:var(--b);height:var(--b);border-radius:50%;background:var(--btn);color:#fbe9ec;border:none;font-family:var(--font-title);font-size:1.3em;box-shadow:0 4px 0 var(--btn-dk);touch-action:none}
.ab span{font-size:11px;color:#56614f;transform:rotate(22deg)}
.startbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.startbtn button{width:58px;height:16px;border-radius:999px;background:#7d8874;border:none;transform:rotate(-22deg);box-shadow:0 2px 0 #5c6655;touch-action:none}
.startbtn span{font-size:11px;color:#56614f;letter-spacing:.1em}
.keys{position:absolute;left:0;right:0;top:-2px;text-align:center;font-size:11px;color:#5d6956}
@media (hover:none){.keys{display:none}}
@media (prefers-reduced-motion:reduce){#msg .next,#title .mons canvas{animation:none}}
</style>

<div id="app">
  <div id="bezel">
    <div id="screen">
      <canvas id="world" width="160" height="144"></canvas>
      <canvas id="bcanvas" width="240" height="216" hidden></canvas>
      <div class="hpbox foe" id="hpFoe" hidden>
        <div class="top"><b class="n"></b><span class="l"></span></div>
        <div class="hpbar"><i></i></div>
      </div>
      <div class="hpbox me" id="hpMe" hidden>
        <div class="top"><b class="n"></b><span class="l"></span></div>
        <div class="hpbar"><i></i></div>
        <div class="nums"></div>
        <div class="expbar"><i></i></div>

      <div id="msg" hidden><p></p><span class="next" hidden>▼</span></div>

      <div id="title">
        <div class="mons"><canvas width="32" height="32" data-sp="hwarong"></canvas><canvas width="32" height="32" data-sp="monggeul"></canvas><canvas width="32" height="32" data-sp="saerok"></canvas></div>
        <h1>풀빛 모험</h1>
        <div class="sub">새싹마을에서 시작하는 몬스터 이야기</div>
        <div class="tbtns"><button type="button" id="btnNew">새로 시작</button><button type="button" id="btnLoad" hidden>이어하기</button></div>
      </div>
      <div id="fade"></div>
    </div>
    <div class="brand">PULBIT · POCKET</div>
  </div>
  <div id="pad">
    <div class="keys">방향키 이동 · Z 확인 · X 취소 · M 메뉴</div>

      <button type="button" class="u" data-k="up" aria-label="위">▲</button>

      <button type="button" class="r" data-k="right" aria-label="오른쪽">▶</button>
    </div>
    <div class="ab">
      <div><button type="button" data-k="B" aria-label="B 취소">B</button><span>취소</span></div>
      <div><button type="button" data-k="A" aria-label="A 확인">A</button><span>확인</span></div>
    </div>
    <div class="startbtn"><button type="button" data-k="START" aria-label="메뉴"></button><span>메뉴</span></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 한국어 조사 ---------- */
function batchim(w){
  const ch=w[w.length-1], c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3) return (c-0xAC00)%28!==0;
  if(/[0-9]/.test(ch)) return '0136780'.includes(ch);
  return false;
}
const J={
  i:w=>w+(batchim(w)?'이':'가'),
  eul:w=>w+(batchim(w)?'을':'를'),
  eun:w=>w+(batchim(w)?'은':'는'),
};

/* ---------- 데이터 ---------- */
const TYPES={
  normal:{n:'노멀',c:'#9a957f'}, fire:{n:'불',c:'#e0693a'}, water:{n:'물',c:'#3f86d4'},
  grass:{n:'풀',c:'#45a44b'}, elec:{n:'전기',c:'#d2a514'}
};
const EFF={fire:{grass:2,water:.5,fire:.5},water:{fire:2,grass:.5,water:.5},grass:{water:2,fire:.5,grass:.5},elec:{water:2,grass:.5,elec:.5}};
const eff=(a,d)=>(EFF[a]&&EFF[a][d])||1;
const chip=t=>`<span class="chip" style="background:${TYPES[t].c}">${TYPES[t].n}</span>`;

const MOVES={
  bump:{n:'부딪치기',t:'normal',p:40,a:95},
  scratch:{n:'할퀴기',t:'normal',p:40,a:100},
  peck:{n:'쪼기',t:'normal',p:35,a:100},
  quick:{n:'재빠른공격',t:'normal',p:40,a:100,pri:1},
  gust:{n:'날갯바람',t:'normal',p:45,a:100},
  growl:{n:'으르렁',t:'normal',a:100,st:{who:'foe',stat:'atk',d:-1}},
  harden:{n:'단단해지기',t:'normal',st:{who:'self',stat:'def',d:1}},
  ember:{n:'불씨뿜기',t:'fire',p:40,a:100},
  flamewheel:{n:'화염바퀴',t:'fire',p:60,a:100},
  bubble:{n:'거품',t:'water',p:40,a:100},
  watergun:{n:'물줄기',t:'water',p:55,a:100},
  leaf:{n:'잎날리기',t:'grass',p:40,a:100},
  vine:{n:'넝쿨때리기',t:'grass',p:55,a:100},
  spore:{n:'포자뿌리기',t:'grass',p:35,a:100},
  spark:{n:'찌릿전기',t:'elec',p:40,a:100},
  bolt:{n:'번개꼬리',t:'elec',p:60,a:95},
};

const SPECIES={
  hwarong:{n:'화롱',t:'fire',b:[39,52,43,65],cr:45,xp:62,learn:[[1,'bump'],[1,'growl'],[5,'ember'],[9,'quick'],[13,'flamewheel']],
    dex:'꼬리 끝 불꽃으로 기분을 알 수 있다. 신이 나면 불꽃이 커진다.'},
  monggeul:{n:'몽글',t:'water',b:[44,48,65,43],cr:45,xp:63,learn:[[1,'bump'],[1,'harden'],[5,'bubble'],[9,'quick'],[13,'watergun']],
    dex:'아침 이슬이 모여 태어났다고 한다. 말랑한 몸으로 공격을 받아 낸다.'},
  saerok:{n:'새록',t:'grass',b:[45,49,49,45],cr:45,xp:64,learn:[[1,'bump'],[1,'growl'],[5,'leaf'],[9,'harden'],[13,'vine']],
    dex:'뿔에 돋은 잎은 계절마다 색이 바뀐다. 햇볕을 쬐면 기운이 난다.'},
  toktok:{n:'톡톡이',t:'normal',b:[30,56,35,72],cr:255,xp:51,learn:[[1,'bump'],[1,'growl'],[6,'quick'],[10,'scratch']],
    dex:'풀숲 어디에나 산다. 앞니로 나무 열매를 톡톡 두드려 연다.'},
  gitteol:{n:'깃털이',t:'normal',b:[40,45,40,56],cr:255,xp:50,learn:[[1,'peck'],[1,'growl'],[6,'gust'],[11,'quick']],
    dex:'새벽마다 마을 지붕에 모여 노래한다. 머리 깃털이 서면 화난 것이다.'},
  beoseot:{n:'버섯콩',t:'grass',b:[50,42,58,30],cr:190,xp:55,learn:[[1,'bump'],[1,'harden'],[4,'spore'],[10,'vine']],
    dex:'비 온 다음 날 풀숲에서 쑥 자라난다. 갓의 무늬는 하나도 같은 게 없다.'},
  jjirit:{n:'찌릿',t:'elec',b:[35,55,40,90],cr:90,xp:82,learn:[[1,'bump'],[1,'growl'],[4,'spark'],[9,'quick'],[13,'bolt']],
    dex:'아주 드물게 보인다. 놀라면 더듬이에서 불꽃이 튄다. 무척 빠르다.'},
  olchaeng:{n:'올챙몽',t:'water',b:[40,50,40,70],cr:190,xp:60,learn:[[1,'bubble'],[1,'bump'],[8,'harden'],[12,'watergun']],
    dex:'연못가에서 꼬리를 흔들며 논다. 커다란 눈으로 물속을 훤히 본다.'},
};
const DEX_ORDER=['hwarong','monggeul','saerok','toktok','gitteol','beoseot','jjirit','olchaeng'];
const STARTERS=['hwarong','monggeul','saerok'];
const WEAK_TO={hwarong:'saerok',monggeul:'hwarong',saerok:'monggeul'}; // 라이벌은 내 스타터에게 약한 녀석을 고른다
const STAGE=[2/8,2/7,2/6,2/5,2/4,2/3,1,1.5,2,2.5,3,3.5,4];

function stats(m){const b=SPECIES[m.sp].b,L=m.lv;return{hp:Math.floor(b[0]*2*L/100)+L+10,atk:Math.floor(b[1]*2*L/100)+5,def:Math.floor(b[2]*2*L/100)+5,spd:Math.floor(b[3]*2*L/100)+5};}
function makeMon(sp,lv){const m={sp,lv,exp:lv**3,moves:[]};for(const [l,mv] of SPECIES[sp].learn) if(l<=lv){if(m.moves.length>=4)m.moves.shift();m.moves.push(mv);} m.hp=stats(m).hp;return m;}
const mname=m=>m.nick||SPECIES[m.sp].n;
const hpColor=p=>p>50?'var(--hp-good)':p>20?'var(--hp-mid)':'var(--hp-low)';

/* ---------- 지도 ---------- */
const MAP=[
"TTTTTTTTTTTTTTTTTTTT",
"T..f.......f.......T",
"T.RRRR.......CCCC..T",
"T.RRRR.......CCCC..T",
"T.WDWW...S...cEcc..T",
"T..=..........=..f.T",
"T..============....T",
"T.f......=.....f...T",
"T....S...=.........T",
"TTTTTTT..=..TTTTTTTT",
"T,,,,....=....,,,,,T",
"T,,,,,...=...,,,,,,T",
"T,,,,,...=...,,~~~,T",
"T.,,,....=....,~~~,T",
"T........=.....~~~.T",
"T..TT....=.........T",
"T..TT..,,=,,....TT.T",
"T......,,=,,....TT.T",
"T,,,,..,,=,,..,,,,,T",
"T,,,,,...=...,,,,,,T",
"T,,,,,...=...,,,,,,T",
"T........=.........T",
"TTTTTTTT.=.TTTTTTTTT",
"T..f.....=.....f...T",
"T........=.........T",
"T........=.........T",
"T....S...=.........T",
"T..ff....=....ff...T",
"TTTTTTTTTTTTTTTTTTTT"];
const MW=MAP[0].length, MH=MAP.length, TS=16, VW=10, VH=9;

function encounterTable(x,y){
  if(y>=10&&y<=14&&x>=13) return [['olchaeng',3,5,50],['toktok',2,4,25],['gitteol',2,4,25]];
  if(y>=10&&y<=14) return [['toktok',2,4,40],['gitteol',2,4,35],['beoseot',3,4,20],['jjirit',4,4,5]];
  return [['toktok',4,6,25],['gitteol',4,6,25],['beoseot',4,6,25],['olchaeng',4,6,15],['jjirit',5,6,10]];
}
function rollWild(x,y){
  const tb=encounterTable(x,y), tot=tb.reduce((s,e)=>s+e[3],0);
  let r=Math.random()*tot;
  for(const e of tb){if((r-=e[3])<0)return makeMon(e[0],rnd(e[1],e[2]));}
  return makeMon(tb[0][0],tb[0][1]);
}

const OUTLINE=[42,36,51];
const SPRITES={};
function buildSprite(sp){
  const c=document.createElement('canvas');c.width=c.height=32;
  const g=c.getContext('2d',{willReadFrequently:true});
  ART[sp].shape(g);
  let id=g.getImageData(0,0,32,32);const d=id.data;
  for(let i=3;i<d.length;i+=4)d[i]=d[i]>=110?255:0;
  g.putImageData(id,0,0);
  ART[sp].detail(g);
  id=g.getImageData(0,0,32,32);
  const src=id.data,out=new Uint8ClampedArray(src);
  for(let y=0;y<32;y++)for(let x=0;x<32;x++){
    const i=(y*32+x)*4;if(src[i+3])continue;
    const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const X=x+dx,Y=y+dy;return X>=0&&Y>=0&&X<32&&Y<32&&src[(Y*32+X)*4+3];});
    if(n){out[i]=OUTLINE[0];out[i+1]=OUTLINE[1];out[i+2]=OUTLINE[2];out[i+3]=255;}
  }
  g.putImageData(new ImageData(out,32,32),0,0);
  const f=document.createElement('canvas');f.width=f.height=32;
  const fg=f.getContext('2d');fg.translate(32,0);fg.scale(-1,1);fg.drawImage(c,0,0);
  const s=document.createElement('canvas');s.width=s.height=32;
  const sg=s.getContext('2d');sg.drawImage(c,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='#4b5246';sg.fillRect(0,0,32,32);
  SPRITES[sp]={n:c,f,s};
}
DEX_ORDER.forEach(buildSprite);

    const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,cv.width,cv.height);
    g.drawImage(SPRITES[cv.dataset.sp][cv.dataset.sil?'s':'n'],0,0,cv.width,cv.height);
  });
}

    case '=':R(g,x,y,16,16,'#ead39b');if(v<2){R(g,x+3,y+4,2,1,'#d6bb7d');R(g,x+11,y+12,2,1,'#d6bb7d');}else R(g,x+8,y+8,2,1,'#d6bb7d');break;
    case 'T':R(g,x,y,16,16,'#9bd772');R(g,x+6,y+11,4,5,'#7a5232');
      R(g,x+2,y+2,12,10,'#3d8a45');R(g,x+1,y+4,14,6,'#3d8a45');R(g,x+4,y+1,8,2,'#3d8a45');

    case '~':{R(g,x,y,16,16,'#5db1e6');const o=Math.floor(time/400+tx+ty)%4;R(g,x+((o*3)%12),y+4,4,1,'#bfe4fa');R(g,x+((o*3+7)%12),y+11,4,1,'#bfe4fa');
      if(tileAt(tx,ty-1)!=='~')R(g,x,y,16,2,'#e8f6ff');if(tileAt(tx-1,ty)!=='~')R(g,x,y,2,16,'#e8f6ff');if(tileAt(tx+1,ty)!=='~')R(g,x+14,y,2,16,'#3f8fc4');if(tileAt(tx,ty+1)!=='~')R(g,x,y+14,16,2,'#3f8fc4');break;}
    case 'R':case 'C':{const top=tileAt(tx,ty-1)!==t,base=t==='R'?'#5c74c9':'#d85b52',ln=t==='R'?'#4459a8':'#b2423c';
      R(g,x,y,16,16,base);for(let i=3;i<16;i+=5)R(g,x,y+i,16,1,ln);if(top)R(g,x,y,16,3,t==='R'?'#7f93dd':'#ec7d72');
      if(!top)R(g,x,y+14,16,2,'#3a3a44');break;}

function drawPerson(g,x,y,dir,frame,L){
  R(g,x+3,y+14,10,2,'rgba(0,0,0,.18)');
  const leg=frame?1:0;
  R(g,x+5,y+12,2,leg?3:2,L.pants);R(g,x+9,y+12,2,leg?2:3,L.pants);
  R(g,x+4,y+8,8,4,L.shirt);R(g,x+3,y+8,1,3,L.skin);R(g,x+12,y+8,1,3,L.skin);
  R(g,x+4,y+3,8,5,L.skin);
  R(g,x+4,y+1,8,3,L.cap);R(g,x+3,y+2,10,2,L.cap);
  if(dir==='up'){R(g,x+4,y+3,8,5,L.hair);}
  else{
    R(g,x+4,y+3,1,3,L.hair);R(g,x+11,y+3,1,3,L.hair);
    if(dir==='down'){R(g,x+6,y+5,1,2,EYE);R(g,x+9,y+5,1,2,EYE);}

    if(dir==='right'){R(g,x+8,y+5,1,2,EYE);R(g,x+11,y+5,1,2,EYE);R(g,x+4,y+3,2,4,L.hair);}

}
let mode='title', busy=true, moving=null, stepN=0, bubble=null;
function renderWorld(time){
  const g=wg;g.imageSmoothingEnabled=false;
  let px=S.x*TS,py=S.y*TS;
  if(moving){px=(moving.fx+(moving.tx-moving.fx)*moving.t)*TS;py=(moving.fy+(moving.ty-moving.fy)*moving.t)*TS;}
  const camX=clamp(Math.round(px-(VW*TS/2-8)),0,MW*TS-VW*TS), camY=clamp(Math.round(py-(4*TS)),0,MH*TS-VH*TS);
  const tx0=Math.floor(camX/TS),ty0=Math.floor(camY/TS);
  for(let ty=ty0;ty<=ty0+VH;ty++)for(let tx=tx0;tx<=tx0+VW;tx++)drawTile(g,tileAt(tx,ty),tx*TS-camX,ty*TS-camY,tx,ty,time);
  // 회복센터 표지
  const ex=15*TS-camX,ey=2*TS-camY+9;R(g,ex-6,ey,12,10,'#fbf6ee');R(g,ex-1,ey+2,2,6,'#d85b52');R(g,ex-3,ey+4,6,2,'#d85b52');
  const actors=NPCS.map(n=>({y:n.y*TS,draw:()=>drawPerson(g,n.x*TS-camX,n.y*TS-camY-3,n.dir,0,n.look)}));
  const frame=moving&&moving.t>.25&&moving.t<.8?(stepN%2)+1:0;
  actors.push({y:py,draw:()=>drawPerson(g,Math.round(px-camX),Math.round(py-camY)-3,S.dir,frame&&frame===1?1:0,LOOKS.me)});
  actors.sort((a,b)=>a.y-b.y).forEach(a=>a.draw());
  // 풀숲에 들어가면 다리가 가려짐
  const ptx=Math.round(px/TS),pty=Math.round(py/TS);
  if(tileAt(ptx,pty)===','&&!moving){const x=ptx*TS-camX,y=pty*TS-camY;R(g,x+2,y+10,12,3,'#6cbf5a');for(const bx of [2,6,10])R(g,x+bx+1,y+8,1,4,'#2f7a3a');}

}

  else if(mode==='battle')drawBattle();
  requestAnimationFrame(loop);
}

/* ---------- 입력 ---------- */
const held=[];
let uiKey=null, lastBump=0;
function press(k){
  if(uiKey){uiKey(k);return;}
  if(mode==='world'&&!busy&&!moving){
    if(k==='A')interact();
    else if(k==='START')fieldMenu();
  }
}
function holdOn(k){if(DIRS[k]&&!held.includes(k))held.push(k);press(k);}
function holdOff(k){const i=held.indexOf(k);if(i>=0)held.splice(i,1);}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'A',Z:'A',' ':'A',Enter:'A',x:'B',X:'B',Escape:'B',Backspace:'B',m:'START',M:'START'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();
  if(e.repeat){if(!DIRS[k])return; if(uiKey)press(k);return;}
  if(e.target.tagName==='BUTTON'&&k==='A'&&e.key!=='z'&&e.key!=='Z'&&!e.target.closest('#pad'))return;
  holdOn(k);
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)holdOff(k);});
addEventListener('blur',()=>held.length=0);
document.querySelectorAll('#pad button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}holdOn(k);});
  const up=()=>{b.classList.remove('on');holdOff(k);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',e=>{if(e.detail===0)press(k);}); // 키보드로 누른 경우
});
$('#msg').addEventListener('click',()=>{if(uiKey)uiKey('A');});

/* ---------- 대화 · 선택 ---------- */
function say(text){
  return new Promise(res=>{
    const box=$('#msg'),p=box.querySelector('p'),nx=box.querySelector('.next');
    box.hidden=false;nx.hidden=true;p.textContent='';
    let i=0,typing=true,timer;
    const tick=()=>{i++;p.textContent=text.slice(0,i);if(i>=text.length){typing=false;nx.hidden=false;}else timer=setTimeout(tick,REDUCED?0:24);};
    timer=setTimeout(tick,24);
    uiKey=k=>{if(k!=='A'&&k!=='B')return;if(typing){typing=false;clearTimeout(timer);p.textContent=text;nx.hidden=false;return;}uiKey=null;res();};
  });
}
const hideMsg=()=>{$('#msg').hidden=true;};
function choose(opts,o={}){
  const {cancel=false,cols=2,prompt='',panel=false,title=''}=o;
  return new Promise(res=>{
    let box,grid;
    if(panel){
      box=$('#panel');box.hidden=false;box.querySelector('.ptitle').textContent=title;
      const body=box.querySelector('.pbody');body.innerHTML='';
      if(prompt){const pp=document.createElement('div');pp.className='prompt';pp.textContent=prompt;pp.style.fontSize='.85em';body.append(pp);}
      grid=document.createElement('div');grid.className='grid';body.append(grid);
      const cl=box.querySelector('.pclose');cl.hidden=!cancel;cl.onclick=()=>done(-1);
    }else{
      box=$('#menu');box.innerHTML='';box.hidden=false;
      if(prompt){const pp=document.createElement('div');pp.className='prompt';pp.textContent=prompt;box.append(pp);}
      grid=document.createElement('div');grid.className='grid';box.append(grid);
    }
    grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
    let idx=Math.max(0,opts.findIndex(x=>!(x&&x.disabled)));
    const btns=opts.map((op,i)=>{
      const b=document.createElement('button');b.type='button';b.className='opt';
      if(typeof op==='string')b.textContent=op;else{b.innerHTML=op.html;if(op.disabled)b.classList.add('dim');}
      b.onclick=()=>{idx=i;done(i);};grid.append(b);return b;
    });
    if(cancel&&!panel){const c=document.createElement('button');c.type='button';c.className='opt back';c.textContent='돌아가기';c.onclick=()=>done(-1);box.append(c);}
    paintMinis(box);
    const hl=()=>{btns.forEach((b,i)=>b.classList.toggle('sel',i===idx));btns[idx]&&btns[idx].scrollIntoView({block:'nearest'});};hl();
    function done(i){if(i>=0&&opts[i]&&opts[i].disabled)return;uiKey=null;box.hidden=true;res(i);}
    uiKey=k=>{
      const n=opts.length;
      if(k==='A')return done(idx);
      if(k==='B'){if(cancel)done(-1);return;}
      if(k==='left'&&idx%cols>0)idx--;
      else if(k==='right'&&idx%cols<cols-1&&idx+1<n)idx++;
      else if(k==='up'&&idx-cols>=0)idx-=cols;
      else if(k==='down'&&idx+cols<n)idx+=cols;
      hl();
    };
  });
}
function monHTML(m){
  const s=stats(m),pct=m.hp/s.hp*100;
  return `<span class="mrow"><canvas data-sp="${m.sp}" width="32" height="32"></canvas><span class="minfo"><span class="mname">${mname(m)} <em>Lv${m.lv}</em> ${chip(SPECIES[m.sp].t)}</span><span class="hpbar sm"><i style="width:${pct}%;background:${hpColor(pct)}"></i></span><span class="mhp">HP ${m.hp}/${s.hp}${m.hp<=0?' · 기절':''}</span></span></span>`;
}
const pickParty=(title,ok,cancel=true)=>choose(S.party.map((m,i)=>({html:monHTML(m),disabled:!ok(m,i)})),{panel:true,title,cols:1,cancel});

/* ---------- 마을 이동 ---------- */
const MOVE_MS=165;
function update(dt,now){
  if(moving){
    moving.t+=dt/MOVE_MS;
    if(moving.t>=1){S.x=moving.tx;S.y=moving.ty;moving=null;stepN++;onStep();}
    return;
  }
  if(busy||uiKey)return;
  const d=held[held.length-1];if(!d)return;
  S.dir=d;const [dx,dy]=DIRS[d],tx=S.x+dx,ty=S.y+dy;
  if(walkable(tx,ty))moving={fx:S.x,fy:S.y,tx,ty,t:0};
  else if(now-lastBump>450){lastBump=now;const t=tileAt(tx,ty);if(t==='D'||t==='E')run(()=>door(t));}
}
async function run(fn){busy=true;try{await fn();}finally{hideMsg();busy=false;}}
async function onStep(){
  const rv=NPCS.find(n=>n.id==='rival');
  if(!S.flags.rivalBeaten&&S.x===rv.x&&S.y<rv.y&&S.y>=rv.y-4){held.length=0;return run(rivalEvent);}
  if(tileAt(S.x,S.y)===','&&Math.random()<0.13){
    held.length=0;
    return run(()=>battle({wild:rollWild(S.x,S.y)}));
  }
  if(stepN%15===0)save();
}
function interact(){
  const [dx,dy]=DIRS[S.dir],fx=S.x+dx,fy=S.y+dy;
  const n=npcAt(fx,fy);
  if(n)return run(async()=>{n.dir=OPP[S.dir];await n.talk(n);});
  const t=tileAt(fx,fy);
  if(t==='S')return run(()=>say(SIGNS[fx+','+fy]||'글씨가 지워져서 읽을 수 없다.'));
  if(t==='D'||t==='E')return run(()=>door(t));
  if(t==='~')return run(()=>say('맑은 연못이다. 무언가 헤엄치고 있다.'));
}
async function door(t){
  if(t==='D'){await say('엄마: 어서 오렴! 잠깐 쉬었다 가.');healAll();await say('몬스터들이 기운을 되찾았다!');}

}

      const t=await pickParty('누구에게 쓸까?',m=>m.hp>0&&m.hp<stats(m).hp);if(t<0)continue;
      return{type:'potion',idx:t};
    }

function foeMove(ctx){
  const mv=ctx.foe.moves;
  if(ctx.trainer&&Math.random()<.6){
    let best=mv[0],bs=-1;
    for(const id of mv){const m=MOVES[id];const s=m.p?m.p*eff(m.t,SPECIES[ctx.me.sp].t)*(m.t===SPECIES[ctx.foe.sp].t?1.5:1):0;if(s>bs){bs=s;best=id;}}
    return best;
  }
  return mv[Math.floor(Math.random()*mv.length)];
}
async function runTurn(ctx,act){
  const fm=foeMove(ctx);
  if(act.type==='move'){
    const pm=MOVES[act.id].pri||0,pf=MOVES[fm].pri||0;
    const sm=stats(ctx.me).spd,sf=stats(ctx.foe).spd;
    const meFirst=pm!==pf?pm>pf:sm!==sf?sm>sf:Math.random()<.5;
    const seq=meFirst?[['me',act.id],['foe',fm]]:[['foe',fm],['me',act.id]];
    for(const [side,id] of seq){
      await doMove(ctx,side,id);
      const r=await checkFaint(ctx);
      if(r)return r==='continue'?null:r;
    }
    return null;
  }
  if(act.type==='run'){
    if(ctx.trainer){await say('승부 중에는 도망칠 수 없다!');return null;}
    ctx.runs++;
    const sm=stats(ctx.me).spd,sf=stats(ctx.foe).spd;
    if(sm>=sf||Math.random()<sm/sf*.5+.25*ctx.runs){await say('무사히 도망쳤다!');return 'run';}
    await say('도망칠 수 없었다!');
  }
  if(act.type==='capsule'){if(await throwCapsule(ctx))return 'caught';}
  if(act.type==='potion'){
    const m=S.party[act.idx],b=m.hp;m.hp=Math.min(stats(m).hp,m.hp+20);S.items.potion--;updateHP(ctx);
    await say(`${J.eun(mname(m))} 체력을 ${m.hp-b} 회복했다!`);
  }
  if(act.type==='switch'){
    await say(`돌아와, ${mname(ctx.me)}!`);B.me.show=false;
    ctx.mi=act.idx;ctx.me=S.party[ctx.mi];ctx.stg.me={atk:0,def:0};updateHP(ctx);
    await say(`가랏, ${mname(ctx.me)}!`);await sendOut('me',ctx.me);
  }
  await doMove(ctx,'foe',fm);
  const r=await checkFaint(ctx);
  return r&&r!=='continue'?r:null;
}
async function doMove(ctx,side,id){
  const other=side==='me'?'foe':'me';
  const atk=ctx[side],def=ctx[other],mv=MOVES[id];
  await say(`${label(ctx,side)}의 ${mv.n}!`);
  if(mv.a&&Math.random()*100>=mv.a){await say('그러나 빗나갔다!');return;}
  if(mv.st){
    const tgt=mv.st.who==='self'?side:other,st=ctx.stg[tgt],key=mv.st.stat,nm=key==='atk'?'공격':'방어';
    const nv=clamp(st[key]+mv.st.d,-6,6);
    if(nv===st[key]){await say(`${label(ctx,tgt)}의 ${J.eun(nm)} 더 이상 변하지 않는다!`);return;}
    st[key]=nv;
    await anim(260,t=>{B[tgt].dy=Math.sin(Math.PI*t*2)*(mv.st.d>0?-4:4);});B[tgt].dy=0;
    await say(`${label(ctx,tgt)}의 ${J.i(nm)} ${mv.st.d>0?'올라갔다':'떨어졌다'}!`);
    return;
  }
  const A=stats(atk).atk*STAGE[ctx.stg[side].atk+6],D=stats(def).def*STAGE[ctx.stg[other].def+6];
  const stab=mv.t===SPECIES[atk.sp].t?1.5:1,e=eff(mv.t,SPECIES[def.sp].t),crit=Math.random()<1/16?1.5:1;
  const dmg=Math.max(1,Math.floor((Math.floor((2*atk.lv/5+2)*mv.p*A/D/50)+2)*stab*e*crit*(.85+Math.random()*.15)));
  await lunge(side);await blink(other);
  def.hp=Math.max(0,def.hp-dmg);updateHP(ctx);await sleep(550);
  if(crit>1)await say('급소에 맞았다!');
  if(e>1)await say('효과가 굉장했다!');else if(e<1)await say('효과가 별로인 듯하다…');
}
async function checkFaint(ctx){
  if(ctx.foe.hp<=0){
    await faint('foe');await say(`${J.eun(label(ctx,'foe'))} 쓰러졌다!`);
    await gainExp(ctx);
    ctx.fi++;
    if(ctx.trainer&&ctx.fi<ctx.foes.length){
      ctx.foe=ctx.foes[ctx.fi];ctx.stg.foe={atk:0,def:0};S.seen[ctx.foe.sp]=true;
      await say(`${J.eun(ctx.trainer.name)} ${J.eul(mname(ctx.foe))} 내보냈다!`);
      updateHP(ctx);await sendOut('foe',ctx.foe);
      return 'continue';
    }
    return 'win';
  }
  if(ctx.me.hp<=0){
    await faint('me');await say(`${J.eun(mname(ctx.me))} 쓰러졌다!`);
    if(!S.party.some(m=>m.hp>0))return 'lose';
    const t=await pickParty('다음 몬스터를 골라 줘!',m=>m.hp>0,false);
    ctx.mi=t;ctx.me=S.party[t];ctx.stg.me={atk:0,def:0};updateHP(ctx);
    await say(`가랏, ${mname(ctx.me)}!`);await sendOut('me',ctx.me);
    return 'continue';
  }
  return null;
}
async function gainExp(ctx){
  const me=ctx.me,f=ctx.foe;
  const g=Math.max(1,Math.floor(SPECIES[f.sp].xp*f.lv/7*1.5*(ctx.trainer?1.5:1)));
  me.exp+=g;updateHP(ctx);
  await say(`${J.eun(mname(me))} 경험치를 ${g} 얻었다!`);
  while(me.lv<50&&me.exp>=(me.lv+1)**3){
    const oldMax=stats(me).hp;me.lv++;me.hp+=stats(me).hp-oldMax;updateHP(ctx);
    await say(`${J.eun(mname(me))} 레벨 ${J.i(String(me.lv))} 되었다!`);
    for(const [l,id] of SPECIES[me.sp].learn){
      if(l!==me.lv||me.moves.includes(id))continue;
      if(me.moves.length<4){me.moves.push(id);await say(`${J.eun(mname(me))} ${J.eul(MOVES[id].n)} 배웠다!`);continue;}
      await say(`${J.eun(mname(me))} ${J.eul(MOVES[id].n)} 배우고 싶어 한다!\n하지만 기술은 4개까지만 쓸 수 있다.`);
      const k=await choose([...me.moves.map(x=>MOVES[x].n),'배우지 않는다'],{prompt:'어떤 기술을 잊게 할까?'});
      if(k>=0&&k<4){const old=MOVES[me.moves[k]].n;me.moves[k]=id;await say(`${J.eul(old)} 잊고 ${J.eul(MOVES[id].n)} 배웠다!`);}
      else await say(`${J.eun(mname(me))} ${J.eul(MOVES[id].n)} 배우지 않았다.`);
    }
  }
}
async function throwCapsule(ctx){
  S.items.capsule--;
  await say(`${J.eun(S.name)} 포획캡슐을 던졌다!`);
  hideMsg();
  B.cap={x:50,y:150,rot:0};
  await anim(520,t=>{B.cap.x=50+(172-50)*t;B.cap.y=150+(58-150)*t-Math.sin(Math.PI*t)*60;B.cap.rot=t*12;});
  await anim(200,t=>{B.foe.alpha=1-t;});B.foe.show=false;B.foe.alpha=1;
  await anim(260,t=>{B.cap.y=58+28*t;B.cap.rot=0;});
  const M=stats(ctx.foe).hp,H=ctx.foe.hp;
  const p=Math.min(1,((3*M-2*H)*SPECIES[ctx.foe.sp].cr)/(3*M)/255*1.4);
  const caught=Math.random()<p,shakes=caught?3:Math.floor(Math.random()*3);
  for(let i=0;i<shakes;i++){await sleep(380);await anim(320,t=>{B.cap.rot=Math.sin(t*Math.PI*2)*.5;});B.cap.rot=0;}
  await sleep(350);
  if(!caught){
    B.cap=null;B.foe.show=true;await blink('foe');
    await say(['앗! 캡슐에서 나와 버렸다!','아깝다! 조금만 더!','으악! 거의 잡았는데!'][shakes]);
    return false;
  }
  await say(`해냈다! ${J.eul(mname(ctx.foe))} 잡았다!`);
  const isNew=!S.caught[ctx.foe.sp];S.caught[ctx.foe.sp]=true;
  if(isNew)await say(`${J.eun(mname(ctx.foe))} 도감에 새로 등록되었다!`);
  const mon={sp:ctx.foe.sp,lv:ctx.foe.lv,exp:ctx.foe.lv**3,hp:ctx.foe.hp,moves:[...ctx.foe.moves]};
  if(S.party.length<6)S.party.push(mon);
  else{S.box.push(mon);await say(`몬스터가 6마리라서 ${J.eun(mname(mon))} 보관함으로 보내졌다.`);}
  B.cap=null;
  return true;
}

/* ---------- 시작 ---------- */
function nameEntry(){
  return new Promise(res=>{
    const pn=$('#panel');pn.hidden=false;pn.querySelector('.ptitle').textContent='네 이름은?';pn.querySelector('.pclose').hidden=true;
    const body=pn.querySelector('.pbody');
    body.innerHTML='<form class="namebox"><label for="nameInput">모험가 이름 (최대 6글자)</label><input id="nameInput" maxlength="6" value="새봄" autocomplete="off"><button class="go" type="submit">이걸로 할래</button></form>';
    const inp=body.querySelector('input');
    body.querySelector('form').onsubmit=e=>{e.preventDefault();const v=inp.value.trim()||'새봄';pn.hidden=true;inp.blur();res(v);};
    setTimeout(()=>{try{inp.focus();inp.select();}catch(_){}},50);
  });
}
function starterPick(){
  return new Promise(res=>{
    const pn=$('#panel');pn.hidden=false;pn.querySelector('.ptitle').textContent='첫 몬스터를 골라 줘';pn.querySelector('.pclose').hidden=true;
    const body=pn.querySelector('.pbody');
    const blurb={hwarong:'씩씩하고 빠른 불 타입',monggeul:'튼튼한 물 타입',saerok:'균형 잡힌 풀 타입'};
    body.innerHTML=`<div class="starter-row">${STARTERS.map(sp=>`<button type="button" class="scard" data-sp="${sp}"><canvas data-sp="${sp}" width="32" height="32"></canvas><b>${SPECIES[sp].n}</b>${chip(SPECIES[sp].t)}<p>${blurb[sp]}</p></button>`).join('')}</div><p style="font-size:.8em;color:#4b5246;margin:.2em">불은 풀에, 풀은 물에, 물은 불에 강해.</p>`;
    paintMinis(body);
    const cards=[...body.querySelectorAll('.scard')];let idx=0;
    const hl=()=>cards.forEach((c,i)=>c.classList.toggle('sel',i===idx));hl();
    const done=i=>{uiKey=null;pn.hidden=true;res(STARTERS[i]);};
    cards.forEach((c,i)=>c.onclick=()=>{idx=i;hl();done(i);});
    uiKey=k=>{if(k==='left')idx=(idx+2)%3;if(k==='right')idx=(idx+1)%3;hl();if(k==='A')done(idx);};
  });
}
async function newGame(){
  $('#title').hidden=true;
  mode='intro';
  wg.fillStyle='#e9f3d8';wg.fillRect(0,0,160,144);
  wg.drawImage(SPRITES.saerok.n,64,30,32,32);
  await say('버들 박사: 반가워! 몬스터의 세계에 온 걸 환영한단다.');
  await say('버들 박사: 이 세계에는 몬스터라는 신기한 친구들이 살고 있지.');
  await say('버들 박사: 나는 몬스터를 연구하는 버들 박사란다. 그런데 너는 누구니?');
  hideMsg();
  const name=await nameEntry();
  S=newState(name);
  await say(`버들 박사: ${name}! 좋은 이름이구나.`);
  await say('버들 박사: 여기 세 마리 중에서 너와 함께할 첫 몬스터를 고르렴.');
  hideMsg();
  let sp;
  while(true){
    sp=await starterPick();
    const c=await choose(['응, 이 친구로 할래','다시 고를래'],{cols:1,prompt:`${J.eul(SPECIES[sp].n)} 고를까?`});
    if(c===0)break;
  }
  S.starter=sp;S.party.push(makeMon(sp,5));S.caught[sp]=true;S.seen[sp]=true;
  await say(`${J.eun(name)} ${J.eul(SPECIES[sp].n)} 파트너로 맞이했다!`);
  const rsp=WEAK_TO[sp];S.seen[rsp]=true;
  await say(`하늘: 잠깐! 그럼 난 ${J.eul(SPECIES[rsp].n)} 데려갈래!`);
  await say(`하늘: 1번 도로 끝에서 기다릴게, ${name}. 먼저 가 있는다!`);
  await say('버들 박사: 허허, 기운이 넘치는구나. 자, 너의 모험을 시작하렴!');
  hideMsg();
  buildNpcs();save();
  mode='world';busy=false;
}
function continueGame(){
  const s=loadSave();if(!s)return;
  S=s;buildNpcs();$('#title').hidden=true;mode='world';busy=false;
}
// 타이틀
paintMinis($('#title'));
const hasSave=!!loadSave();
$('#btnLoad').hidden=!hasSave;
$('#btnNew').onclick=()=>{uiKey=null;newGame();};
$('#btnLoad').onclick=()=>{uiKey=null;continueGame();};
(()=>{const bs=[$('#btnNew'),$('#btnLoad')].filter(b=>!b.hidden);let i=bs.length-1;
  const hl=()=>bs.forEach((b,j)=>b.classList.toggle('sel',j===i));hl();
  uiKey=k=>{if(k==='up'||k==='down'){i=(i+1)%bs.length;hl();}if(k==='A')bs[i].click();};})();
addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='world')save();});
requestAnimationFrame(loop);
})();
